# Publishes com.oblodai:oblodai-sdk to Maven Central on a v<major>.<minor>.<patch> tag.
#
# Required repository secrets — the job fails loudly, before building anything, when one is missing:
#   MAVEN_GPG_PRIVATE_KEY   ASCII-armoured private key (gpg --armor --export-secret-keys <KEY_ID>)
#   MAVEN_GPG_PASSPHRASE    its passphrase
#   CENTRAL_TOKEN_USERNAME  Central Portal user token, username half
#   CENTRAL_TOKEN_PASSWORD  Central Portal user token, password half
#
# The deploy uploads a bundle and stops at `validated`: nothing becomes public until a human presses
# Publish in the Central portal. See RELEASING.md.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: require the publishing secrets
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          missing=""
          for name in MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::cannot publish: missing repository secret(s):$missing"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: the tag must match the project version
        run: |
          version="$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pom.xml version $version"
            exit 1
          fi

      - name: contract drift
        run: bash codegen/run.sh --check

      - name: build and test
        run: mvn -B verify

      - name: deploy to Maven Central
        run: mvn -B -Prelease deploy
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
