# `mvn verify` (compile with -Werror → offline tests → jar, sources jar, javadoc jar). The shared
# conformance suite runs against the vendored snapshot in contract/ (refreshed and checked by
# ./scripts/vendor_contract.sh); the generated-code drift check needs the backend's generator (a
# private repository) and runs locally: `make ci` with OBLODAI_BACKEND.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: build and test
        run: mvn -B verify
        env:
          SDKGEN_CONFORMANCE: ${{ github.workspace }}/contract/tools/sdkgen/conformance
