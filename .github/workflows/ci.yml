# `mvn verify` (compile with -Werror → offline tests → jar, sources jar, javadoc jar). The drift
# check and the conformance suite need the backend checkout: run `make ci` locally.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: build and test
        run: mvn -B verify
